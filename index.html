<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala de Folga</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            font-size: 1rem;
            color: #333;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Escala de Folga</h1>
        
        <form action="escala.php" method="POST">
            <div class="form-group">
                <label for="escalaSelect">Selecione o dia da escala:</label>
                <!-- O atributo 'name' é fundamental para que o PHP receba o valor -->
                <select id="escalaSelect" name="dia_escala" required>
                    <option value="" disabled selected>Escolha uma opção...</option>
                    <option value="1_F">1º dia de Folga</option>
                    <option value="2_F">2º dia de Folga</option>
                    <option value="1_T">1º dia de Trabalho</option>
                    <option value="2_T">2º dia de Trabalho</option>
                    <option value="3_T">3º dia de Trabalho</option>
                    <option value="4_T">4º dia de Trabalho</option>
                </select>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </div>

</body>
</html>
