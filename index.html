<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala de Folga</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- Importando o jQuery via CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Escala de Folga</h1>
        <h4>Hoje, 10 de outubro de 2026</h4>

        <!-- Formulário sem action fixa, controlado inteiramente por jQuery -->
        <form id="formEscala">
            <div class="form-group">
                <label for="escalaSelect">Selecione o dia da escala:</label>
                <select id="escalaSelect" name="dia_escala" required>
                    <option value="" disabled selected>Escolha uma opção...</option>
                    <option value="1_F">1º dia de Folga</option>
                    <option value="2_F">2º dia de Folga</option>
                    <option value="1_T">1º dia de Trabalho</option>
                    <option value="2_T">2º dia de Trabalho</option>
                    <option value="3_T">3º dia de Trabalho</option>
                    <option value="4_T">4º dia de Trabalho</option>
                </select>
            </div>
            <button type="submit">Enviar via AJAX</button>
        </form>                                                                                                                       

    </div>

    <div id="respostaStatus"></div>

   <script>
        $(document).ready(function() {
            // Variável solicitada para armazenar o objeto JSON retornado
            let $dadosJSON = null;

            $('#formEscala').on('submit', function(event) {
                // Impede o envio natural/padrão do formulário (recarregamento da página)
                event.preventDefault();

                // Captura os dados do formulário serializados
                const formData = $(this).serialize();
                alert(formData); // Exibe os dados serializados para verificação    
                // Envia os dados para escala.php via requisição AJAX assíncrona
                $.ajax({
                    url: 'escala.php',
                    type: 'POST', // Pode ser 'GET' dependendo de como seu PHP processa
                    data: formData,
                    dataType: 'json', // Garante que o jQuery trate a resposta como objeto JSON
                    success: function(response) {
                        // Armazena o resultado no objeto $dadosJSON
                        alert(response);
                        $dadosJSON = response;
                        
                        $('#respostaStatus').text('Dados recebidos e armazenados com sucesso!');
                        console.log("Objeto $dadosJSON armazenado:", $dadosJSON);
                        alert($dadosJSON);

                        // Aqui você pode prosseguir para renderizar a tabela ou manipular os dados
                    },
                    error: function(xhr, status, error) {
                        alert(status);
                        $('#respostaStatus').css('color', '#e74c3c').text('Erro ao processar a requisição.');
                        console.error("Erro AJAX:", error);
                    }
                });
            });
        });
    </script>
</body>
</html>
